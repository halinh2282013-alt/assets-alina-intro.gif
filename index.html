<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alina</title>
    <!-- Google Fonts: Serif thanh mảnh, mang nét cổ điển, điện ảnh -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MÀN HÌNH INTRO -->
    <div id="intro-screen" class="intro-screen">
        <!-- Hình nền GIF mùa đông ở Nga -->
        <div class="intro-bg-wrapper">
            <img src="assets/alina-intro.gif" alt="Alina Winter Background" class="intro-bg-img" id="introGif">
            <!-- Lớp phủ xanh đen trong suốt rất nhẹ để tăng độ tương phản chữ -->
            <div class="intro-overlay"></div>
            <!-- Lớp sương tuyết phủ màn hình khi chuyển cảnh -->
            <div class="frost-transition-overlay" id="frostOverlay"></div>
        </div>

        <!-- Cụm nội dung trung tâm -->
        <div class="intro-content" id="introContent">
            <h1 class="intro-title">Alina</h1>
            <p class="intro-slogan">somewhere between the snow and the songs.</p>
            <button class="intro-btn" id="enterBtn" aria-label="Enter Alina">
                <span>ENTER ALINA</span>
            </button>
        </div>
    </div>

    <!-- KHU VỰC NỘI DUNG CHÍNH (Điểm tiếp nhận chuyển cảnh tối giản) -->
    <main id="main-content" class="main-content" aria-hidden="true">
        <div class="main-placeholder">
            <h2>Alina</h2>
            <p>Nội dung chính của website sẽ được hiển thị tại đây ở giai đoạn sau.</p>
        </div>
    </main>

    <!-- Âm thanh gió mùa đông (Tùy chọn/Dự phòng) -->
    <audio id="windAudio" loop preload="auto">
        <source src="assets/winter-wind.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
